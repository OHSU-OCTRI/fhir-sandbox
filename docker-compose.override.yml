# Local default environment overrides, useful for development environments
services:
  app:
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://mysql/fhir_sandbox?serverTimezone=America/Los_Angeles
  mysql:
    image: mysql:8.4
    volumes:
      - ./docker_data/mysql:/var/lib/mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=fhir_sandbox
      - MYSQL_USER=fhir_sandbox
      - MYSQL_PASSWORD
      - MYSQL_ROOT_PASSWORD
