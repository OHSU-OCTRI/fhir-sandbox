apiVersion: apps/v1
kind: Deployment
metadata:
  name: fhir-sandbox-prod
  labels:
    app: fhir-sandbox-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fhir-sandbox-prod
  template:
    metadata:
      labels:
        app: fhir-sandbox-prod
      annotations:
        co.elastic.logs/multiline.type: pattern
        co.elastic.logs/multiline.pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
        co.elastic.logs/multiline.negate: 'true'
        co.elastic.logs/multiline.match: after
        co.elastic.logs/processors.dissect.tokenizer: '%{+@timestamp} %{log.level} %{process.pid|long} --- [%{process.thread.name}] %{log.logger} : %{}'
        co.elastic.logs/processors.dissect.ignore_failure: 'true'
        co.elastic.logs/processors.dissect.trim_values: all
        co.elastic.logs/processors.dissect.target_prefix: ''
        co.elastic.logs/processors.dissect.overwrite_keys: 'true'
        prometheus.io/scrape: 'true'
        prometheus.io/path: /fhir-sandbox/actuator/prometheus
        prometheus.io/port: '8080'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 5333
        runAsGroup: 5333
        fsGroup: 5333
      containers:
      - name: fhir-sandbox
        image: ghcr.io/ohsu-octri/fhir-sandbox:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          requests:
            memory: 1Gi
            cpu: 250m
          limits:
            memory: 4Gi
            cpu: 2000m
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: fhir-sandbox-prod
        - secretRef:
            name: fhir-sandbox-prod
        - secretRef:
            name: ldap-env
        volumeMounts:
        - name: octrikube-nfs
          mountPath: /config/sample_data
          subPath: fhir-sandbox-data/synthea_data
          readOnly: true
        - name: mysql-pki
          mountPath: /etc/pki/mysql
          readOnly: true
        - name: oauth-pki
          mountPath: /config/oauth
          readOnly: true
      volumes:
      - name: octrikube-nfs
        persistentVolumeClaim:
          claimName: octrikube-nfs
      - name: mysql-pki
        secret:
          secretName: prod-mysql-truststore
      - name: oauth-pki
        secret:
          secretName: fhir-sandbox-prod
          defaultMode: 0440
          items:
          - key: jwks-private-key.pem
            path: jwks-private-key.pem
      imagePullSecrets:
      - name: ghcr-registry-cred
