# ConfigMap for fhir-sandbox-prod
#
# k8s documentation:
# - https://kubernetes.io/docs/tasks/configure-pod-container/configure-pod-configmap/#create-a-configmap
#
kind: ConfigMap
apiVersion: v1
metadata:
  name: fhir-sandbox-prod
data:
  EXTRA_JAVA_OPTS: -XX:MaxRAMPercentage=75.0
  SERVER_SERVLET_CONTEXTPATH: /fhir-sandbox
  TZ: America/Los_Angeles
  OCTRI_AUTHENTICATION_BASEURL: https://octriinternal.ohsu.edu
  OCTRI_SANDBOX_DATA_SAMPLE_DIRECTORIES: file:/config/sample_data/setup,file:/config/sample_data/patients
  OCTRI_SANDBOX_FHIR_BASE_URL: https://octriinternal.ohsu.edu/fhir-sandbox-backend/fhir
  OCTRI_SANDBOX_OAUTH2_ISSUER_URL: https://octriinternal.ohsu.edu/fhir-sandbox
  OCTRI_SANDBOX_OAUTH2_PRIVATE_KEY_LOCATION: file:/config/oauth/jwks-private-key.pem